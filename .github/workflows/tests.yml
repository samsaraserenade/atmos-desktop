# Every unit test (npm run test:all) on each push and pull request.
# The end-to-end checks (scripts/e2e) need Electron and a display and are
# still run by hand; see scripts/e2e/README.md.
name: Tests

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

# Actions are pinned to the commit of the tag they follow (the comment): a
# tag can be moved to other code, a commit can't. To update one, look up
# the new tag's commit (git ls-remote https://github.com/actions/<name>
# refs/tags/<tag>) and change both.

jobs:
  unit:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      # The unit tests don't start Electron; skip its 100 MB download.
      ELECTRON_SKIP_BINARY_DOWNLOAD: '1'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24
          cache: npm
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12'
      - run: npm ci
      - name: Install Matrix Chat's own dependencies
        if: hashFiles('plugins/matrix-chat/package-lock.json') != ''
        run: npm ci
        working-directory: plugins/matrix-chat
      - run: npm run test:all
