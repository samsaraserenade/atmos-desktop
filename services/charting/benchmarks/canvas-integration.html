<!doctype html><meta charset="utf-8"><title>Canvas chart integration</title><style>body{margin:16px;background:#141b26;color:white;--ink-rgb:220,230,245;--surface-rgb:20,27,38}#chart{height:460px;width:100%}button{padding:10px}</style><h2>Production canvas renderer: 5,000 candles</h2><button id="test">Verify live update, resize and modes</button><p id="status">Loading</p><div id="chart"></div><script type="module">
import {createTimeSeriesChart} from '/chart-next.js';
const data=Array.from({length:5000},(_,i)=>({t0:i*60000,t1:(i+1)*60000,o:100+Math.sin(i*.02)*10,h:114,l:86,c:100+Math.sin(i*.02+.5)*10}));
const chart=createTimeSeriesChart(document.querySelector('#chart'),{type:'candlestick',data,bucketMs:60000,candleAnimation:false,indicator:{},activeRangeKey:'all'});
const status=document.querySelector('#status');status.textContent='Canvas mounted: '+chart.getState().pointCount+' candles';
document.querySelector('#test').onclick=async()=>{try{chart.updateLatest({...data.at(-1),c:111,h:118});chart.setOptions({priceScale:'log'});chart.resize();chart.setType('line');chart.setType('heiken-ashi');chart.setType('candlestick');await new Promise(requestAnimationFrame);const canvas=document.querySelector('.atmos-chart__indicator-layer canvas');const ctx=canvas.getContext('2d');const pixels=ctx.getImageData(0,0,canvas.width,canvas.height).data;let painted=0;for(let i=3;i<pixels.length;i+=4)if(pixels[i])painted++;if(!painted)throw Error('Canvas is blank');status.textContent='PASS: '+chart.getState().pointCount+' candles; '+canvas.width+' × '+canvas.height+' bitmap; '+painted+' painted pixels; live update, log scale, resize and mode switches completed.';}catch(e){status.textContent='FAIL: '+e.message}};
</script>
