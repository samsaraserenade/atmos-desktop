<!doctype html><meta charset="utf-8"><title>Chart renderer benchmark</title>
<style>body{background:#10141d;color:#e1e7f0;font:14px system-ui;margin:20px}button{padding:10px 20px}#stage{position:relative;width:1100px;height:460px;background:#141b26;max-width:100%}svg,canvas{position:absolute;inset:0;width:100%;height:100%}#overlay{pointer-events:none;transform:translateZ(0)}pre{white-space:pre-wrap}td,th{text-align:right;padding:6px 14px}th:first-child,td:first-child{text-align:left}</style>
<h1>SVG / Canvas indicator benchmark</h1><p>250, 1,000 and 5,000 visible candles · 3 repetitions · 60 measured frames per case</p>
<button id="run">Run benchmark</button><p id="status">Ready. Keep this tab visible during the run.</p>
<div id="stage"><svg id="svg" viewBox="0 0 1100 460"></svg><canvas id="canvas"></canvas><svg id="overlay" viewBox="0 0 1100 460"><path id="cross" stroke="#a6b3c4" stroke-dasharray="3 3" fill="none"/></svg></div><pre id="result"></pre>
<script>
const BUCKET_STEPS_MS = [
  15_000, 30_000, 60_000, 5 * 60_000, 15 * 60_000, 30 * 60_000,
  60 * 60_000, 4 * 60 * 60_000, 24 * 60 * 60_000,
];

function metadataOf(point) {
  const { t, time, timestamp, v, value, price, close, c, start, end, t0, t1, open, o, high, h, low, l, ...metadata } = point || {};
  return metadata;
}

// Preserve the same metadata and OHLC rules as a full bucket rebuild.
function appendCandleSample(candle, point, bucketMs) {
  const value = Number(point.v ?? point.value ?? point.close);
  return { ...metadataOf(candle), ...metadataOf(point), t0: candle.t0,
    t1: candle.t0 + bucketMs, o: candle.o,
    h: Math.max(candle.h, value), l: Math.min(candle.l, value), c: value };
}

function pickBucketMs(points, targetCandles = 60) {
  if (points.length < 2) return BUCKET_STEPS_MS[0];
  const span = points[points.length - 1].t - points[0].t;
  if (span <= 0) return BUCKET_STEPS_MS[0];
  return BUCKET_STEPS_MS.find(step => span / step <= targetCandles) || BUCKET_STEPS_MS[BUCKET_STEPS_MS.length - 1];
}

function bucketHistory(points, bucketMs) {
  if (!Array.isArray(points) || !points.length) return [];
  if (!Number.isFinite(bucketMs) || bucketMs <= 0) throw new TypeError('bucketMs must be positive');
  const buckets = new Map();
  for (const point of points) {
    const t = Number(point.t ?? point.time ?? point.timestamp);
    const v = Number(point.v ?? point.value ?? point.close);
    if (!Number.isFinite(t) || !Number.isFinite(v)) continue;
    const t0 = Math.floor(t / bucketMs) * bucketMs;
    let candle = buckets.get(t0);
    if (!candle) {
      // Keep consumer metadata on derived candles. Canonical chart fields win,
      // while later observations refresh metadata on the forming candle.
      candle = { ...metadataOf(point), t0, t1: t0 + bucketMs, o: v, h: v, l: v, c: v };
      buckets.set(t0, candle);
    } else {
      const open = candle.o;
      const high = candle.h;
      const low = candle.l;
      Object.assign(candle, metadataOf(point));
      candle.t0 = t0;
      candle.t1 = t0 + bucketMs;
      candle.o = open;
      candle.h = Math.max(high, v);
      candle.l = Math.min(low, v);
      candle.c = v;
    }
  }
  return [...buckets.values()].sort((a, b) => a.t0 - b.t0);
}

/**
 * Convert regular OHLC candles into Heiken Ashi candles.
 */
function heikenAshiStep(previous, raw) {
  const { t0, t1, o, h, l, c } = raw;
  const close = (o + h + l + c) / 4;
  const open = previous ? (previous.o + previous.c) / 2 : (o + c) / 2;
  return { ...raw, t0, t1, o: open, h: Math.max(h, open, close), l: Math.min(l, open, close), c: close };
}

function heikenAshi(candles) {
  const output = [];
  let previous = null;
  for (const candle of candles || []) {
    previous = heikenAshiStep(previous, candle);
    output.push(previous);
  }
  return output;
}

function computeCandleScale(candles, innerHeight, padTop, padPercent = 0.08) {
  if (!candles.length) return { minP: 0, rngP: 1, yOf: () => padTop + innerHeight / 2 };
  const minimum = Math.min(...candles.map(candle => candle.l));
  const maximum = Math.max(...candles.map(candle => candle.h));
  const range = maximum - minimum || Math.abs(minimum) * 0.002 || 1;
  const minP = minimum - range * padPercent;
  const rngP = range * (1 + padPercent * 2);
  return { minP, rngP, yOf: value => padTop + innerHeight - ((value - minP) / rngP) * innerHeight };
}

function renderCandlesSVG({
  candles, W, H, padLeft, padRight, padTop, padBottom,
  colorUp, colorDown, opacity = 0.9, xOf = null, bodyWidth = null,
  colorOf = null, yOf: suppliedYOf = null, bridgeFromPreviousClose = false,
}) {
  if (!candles.length) return '';
  const innerWidth = W - padLeft - padRight;
  const innerHeight = H - padTop - padBottom;
  const yOf = suppliedYOf || computeCandleScale(candles, innerHeight, padTop).yOf;
  const slotWidth = innerWidth / candles.length;
  const width = Math.max(1, bodyWidth ?? slotWidth * 0.6);
  let markup = '';
  candles.forEach((candle, index) => {
    const defaultColor = candle.c >= candle.o ? colorUp : colorDown;
    const color = colorOf ? colorOf(candle, index, defaultColor) : defaultColor;
    const x = xOf ? xOf(candle, index) : padLeft + slotWidth * (index + 0.5);
    if (bridgeFromPreviousClose && index > 0 && candles[index - 1].c !== candle.o) {
      const prior = candles[index - 1].c;
      const top = yOf(Math.max(prior, candle.o));
      const bottom = yOf(Math.min(prior, candle.o));
      const bridgeDefault = candle.o >= prior ? colorUp : colorDown;
      const bridgeColor = colorOf ? colorOf(candle, index, bridgeDefault) : bridgeDefault;
      markup += `<rect class="tc-candle-bridge" x="${(x - width / 2).toFixed(1)}" y="${top.toFixed(1)}" width="${width.toFixed(1)}" height="${Math.max(1, bottom - top).toFixed(1)}" fill="${bridgeColor}" opacity="${opacity}"/>`;
    }
    const wickTop = yOf(candle.h);
    const wickBottom = yOf(candle.l);
    const bodyTop = yOf(Math.max(candle.o, candle.c));
    const bodyBottom = yOf(Math.min(candle.o, candle.c));
    markup += `<line x1="${x.toFixed(1)}" y1="${wickTop.toFixed(1)}" x2="${x.toFixed(1)}" y2="${wickBottom.toFixed(1)}" stroke="${color}" stroke-width="1" opacity="${opacity}"/>`;
    markup += `<rect x="${(x - width / 2).toFixed(1)}" y="${bodyTop.toFixed(1)}" width="${width.toFixed(1)}" height="${Math.max(1, bodyBottom - bodyTop).toFixed(1)}" fill="${color}" opacity="${opacity}"/>`;
  });
  return markup;
}

/**
 * Same candle geometry/coloring as renderCandlesSVG, drawn straight onto a
 * 2D canvas context instead of built as an SVG markup string. Used by
 * chart-next.js's candle layer: at high candle counts, painting a few
 * thousand fillRect/stroke calls onto one raster surface is cheap, while
 * creating/diffing that many live SVG <line>/<rect> DOM nodes on every
 * redraw is the expensive part -- this is the same reason the crosshair/
 * axis/toolbar chrome stays SVG (low element count, benefits from real DOM)
 * while the candle body layer moves here (high element count, benefits from
 * having no DOM at all). The caller is expected to have already sized and
 * scaled the canvas (devicePixelRatio) and to clearRect the *previous*
 * frame's drawing itself only when needed -- this function always starts by
 * clearing its own (W, H) region, since a partial/incremental candle redraw
 * isn't meaningfully cheaper than a full one once you're already in canvas
 * land (unlike the SVG string-diff this replaces, there's no "did anything
 * change" shortcut available before painting -- the caller does that check
 * up front instead, by only calling this when the draw key actually changed).
 */
function renderCandlesCanvas(ctx, {
  candles, W, H, padLeft, padRight, padTop, padBottom,
  colorUp, colorDown, opacity = 0.9, xOf = null, bodyWidth = null,
  colorOf = null, yOf: suppliedYOf = null, bridgeFromPreviousClose = false,
}) {
  ctx.clearRect(0, 0, W, H);
  if (!candles.length) return;
  const innerWidth = W - padLeft - padRight;
  const innerHeight = H - padTop - padBottom;
  const yOf = suppliedYOf || computeCandleScale(candles, innerHeight, padTop).yOf;
  const slotWidth = innerWidth / candles.length;
  const width = Math.max(1, bodyWidth ?? slotWidth * 0.6);
  ctx.save();
  ctx.globalAlpha = opacity;
  candles.forEach((candle, index) => {
    const defaultColor = candle.c >= candle.o ? colorUp : colorDown;
    const color = colorOf ? colorOf(candle, index, defaultColor) : defaultColor;
    const x = xOf ? xOf(candle, index) : padLeft + slotWidth * (index + 0.5);
    if (bridgeFromPreviousClose && index > 0 && candles[index - 1].c !== candle.o) {
      const prior = candles[index - 1].c;
      const top = yOf(Math.max(prior, candle.o));
      const bottom = yOf(Math.min(prior, candle.o));
      const bridgeDefault = candle.o >= prior ? colorUp : colorDown;
      const bridgeColor = colorOf ? colorOf(candle, index, bridgeDefault) : bridgeDefault;
      ctx.fillStyle = bridgeColor;
      ctx.fillRect(x - width / 2, top, width, Math.max(1, bottom - top));
    }
    const wickTop = yOf(candle.h);
    const wickBottom = yOf(candle.l);
    const bodyTop = yOf(Math.max(candle.o, candle.c));
    const bodyBottom = yOf(Math.min(candle.o, candle.c));
    ctx.strokeStyle = color;
    ctx.lineWidth = 1;
    ctx.beginPath();
    ctx.moveTo(x, wickTop);
    ctx.lineTo(x, wickBottom);
    ctx.stroke();
    ctx.fillStyle = color;
    ctx.fillRect(x - width / 2, bodyTop, width, Math.max(1, bodyBottom - bodyTop));
  });
  ctx.restore();
}

const SAMSARA_DEFAULTS = Object.freeze({
  movingAverages: Object.freeze([
    Object.freeze({ type: 'EMA', length: 50 }),
    Object.freeze({ type: 'EMA', length: 100 }),
    Object.freeze({ type: 'EMA', length: 150 }),
    Object.freeze({ type: 'EMA', length: 200 }),
    Object.freeze({ type: 'HMA', length: 100 }),
  ]),
  rsiLength: 14,
  rsiUpper: 80,
  rsiLower: 20,
  showMovingAverages: true,
  movingAverageOpacity: 0.58,
  showRsi: true,
  showSessions: true,
  colorCandles: true,
});

function cleanLength(length) {
  return Math.max(1, Math.floor(Number(length) || 1));
}

function sma(values, length) {
  const n = cleanLength(length);
  const output = Array(values.length).fill(null);
  let sum = 0;
  for (let index = 0; index < values.length; index++) {
    sum += values[index];
    if (index >= n) sum -= values[index - n];
    if (index >= n - 1) output[index] = sum / n;
  }
  return output;
}

function ema(values, length) {
  const n = cleanLength(length);
  const output = Array(values.length).fill(null);
  if (!values.length) return output;
  if (n === 1) return values.slice();
  const multiplier = 2 / (n + 1);
  let seed = 0;
  for (let index = 0; index < values.length; index++) {
    if (index < n) seed += values[index];
    if (index === n - 1) output[index] = seed / n;
    else if (index >= n) output[index] = values[index] * multiplier + output[index - 1] * (1 - multiplier);
  }
  return output;
}

function weightedMovingAverage(values, length) {
  const n = cleanLength(length);
  const output = Array(values.length).fill(null);
  const denominator = n * (n + 1) / 2;
  const window = new Array(n);
  let count = 0;
  let cursor = 0;
  let sum = 0;
  let weighted = 0;
  for (let index = 0; index < values.length; index++) {
    const value = values[index];
    if (!Number.isFinite(value)) {
      count = cursor = 0;
      sum = weighted = 0;
      continue;
    }
    if (count === n) {
      const oldSum = sum;
      sum -= window[cursor];
      weighted -= oldSum;
      window[cursor] = value;
      cursor = (cursor + 1) % n;
      weighted += value * n;
      sum += value;
    } else {
      window[count] = value;
      count++;
      sum += value;
      weighted += value * count;
    }
    if (count === n) output[index] = weighted / denominator;
  }
  return output;
}

function wma(values, length) {
  return weightedMovingAverage(values, length);
}

function hma(values, length) {
  const n = cleanLength(length);
  const half = wma(values, Math.max(1, Math.round(n / 2)));
  const full = wma(values, n);
  const difference = values.map((_, index) => Number.isFinite(half[index]) && Number.isFinite(full[index])
    ? 2 * half[index] - full[index]
    : null);
  return weightedMovingAverage(difference, Math.max(1, Math.round(Math.sqrt(n))));
}

function dema(values, length) {
  const first = ema(values, length);
  const firstValid = first.findIndex(Number.isFinite);
  if (firstValid < 0) return first;
  const secondTail = ema(first.slice(firstValid), length);
  const output = Array(values.length).fill(null);
  for (let index = firstValid; index < values.length; index++) {
    const second = secondTail[index - firstValid];
    if (Number.isFinite(second)) output[index] = 2 * first[index] - second;
  }
  return output;
}

function movingAverage(values, type, length) {
  switch (String(type || 'EMA').toUpperCase()) {
    case 'SMA': return sma(values, length);
    case 'WMA': return wma(values, length);
    case 'HMA': return hma(values, length);
    case 'DEMA': return dema(values, length);
    default: return ema(values, length);
  }
}

function rsi(values, length = 14) {
  const n = cleanLength(length);
  const output = Array(values.length).fill(null);
  if (values.length <= n) return output;
  let averageGain = 0;
  let averageLoss = 0;
  for (let index = 1; index <= n; index++) {
    const change = values[index] - values[index - 1];
    averageGain += Math.max(change, 0);
    averageLoss += Math.max(-change, 0);
  }
  averageGain /= n;
  averageLoss /= n;
  const current = () => averageLoss === 0 ? 100 : averageGain === 0 ? 0 : 100 - 100 / (1 + averageGain / averageLoss);
  output[n] = current();
  for (let index = n + 1; index < values.length; index++) {
    const change = values[index] - values[index - 1];
    averageGain = (averageGain * (n - 1) + Math.max(change, 0)) / n;
    averageLoss = (averageLoss * (n - 1) + Math.max(-change, 0)) / n;
    output[index] = current();
  }
  return output;
}

function mergedUtcSession(timestamp) {
  const hour = ((Math.floor(timestamp / 3_600_000) % 24) + 24) % 24;
  if (hour < 7) return { key: 'tokyo', color: '#ff9900' };
  if (hour < 13) return { key: 'london', color: '#4caf4f' };
  if (hour < 21) return { key: 'new-york', color: '#2195f3' };
  return { key: 'sydney', color: '#a461bb' };
}

function buildSamsaraStudy(values, config = SAMSARA_DEFAULTS) {
  const movingAverages = config.showMovingAverages === false ? []
    : (config.movingAverages || SAMSARA_DEFAULTS.movingAverages)
      .filter(setting => setting.enabled !== false)
      .map(setting => ({ ...setting, values: movingAverage(values, setting.type, setting.length) }));
  const rsiValues = config.showRsi === false ? null : rsi(values, config.rsiLength ?? SAMSARA_DEFAULTS.rsiLength);
  return { movingAverages, rsi: rsiValues };
}

function contiguousSegments(values, average, xs, renderFrom) {
  const segments = [];
  let current = null;
  for (let index = renderFrom; index < values.length; index++) {
    if (!Number.isFinite(average[index]) || !Number.isFinite(xs[index])) continue;
    const bullish = values[index] >= average[index];
    const point = { x: xs[index], price: values[index], average: average[index] };
    if (!current || current.bullish !== bullish) {
      const prior = current?.points[current.points.length - 1];
      if (current) segments.push(current);
      current = { bullish, points: prior ? [prior, point] : [point] };
    } else current.points.push(point);
  }
  if (current) segments.push(current);
  return segments;
}

function renderSamsaraOverlaySVG({
  values, times, xs, renderFrom = 0, yOf, plotTop, plotHeight,
  bullishColor, bearishColor, config = SAMSARA_DEFAULTS, clipId = 'atmos-chart-indicator-clip',
  // Callers that re-render the same candle window on every pointer move
  // (panning, hovering) can precompute this once with buildSamsaraStudy()
  // and keep passing it back in here — the MA/RSI crunching only depends
  // on `values`+`config`, never on the per-frame pixel `xs`, so recomputing
  // it every frame is pure waste. Omit it and this still works exactly as
  // before, just recomputing fresh each call.
  study: precomputedStudy,
  // Milliseconds per candle/point at the chart's current timeframe. Session
  // ticks stop being a meaningful signal once a single bar spans more than
  // an hour — a 4H or 1D candle already crosses several sessions on its
  // own, so the strip would just be noise. Defaults to 0 (i.e. "not known
  // to be coarser than 1h") so callers that don't pass it — direct tests,
  // mainly — keep rendering sessions exactly as before.
  intervalMs = 0,
}) {
  if (values.length < 2) return '';
  const study = precomputedStudy || buildSamsaraStudy(values, config);
  let fills = '';
  let lines = '';
  let states = '';
  let signals = '';
  let sessions = '';

  if (config.showMovingAverages !== false) {
    const opacity = Math.max(0, Math.min(1, Number(config.movingAverageOpacity ?? SAMSARA_DEFAULTS.movingAverageOpacity)));
    for (const average of study.movingAverages) {
      for (const segment of contiguousSegments(values, average.values, xs, renderFrom)) {
        if (segment.points.length < 2) continue;
        const color = segment.bullish ? bullishColor : bearishColor;
        const maPoints = segment.points.map(point => `${point.x.toFixed(1)},${yOf(point.average).toFixed(1)}`);
        const pricePoints = segment.points.map(point => `${point.x.toFixed(1)},${yOf(point.price).toFixed(1)}`);
        fills += `<polygon points="${pricePoints.concat(maPoints.slice().reverse()).join(' ')}" fill="${color}" opacity="${(opacity * 0.1).toFixed(3)}"/>`;
        lines += `<path d="M ${maPoints.join(' L ')}" fill="none" stroke="${color}" stroke-width="0.85" opacity="${opacity.toFixed(3)}"/>`;
      }
    }
  }

  let stateStart = null;
  let stateKind = 0;
  const flushState = end => {
    if (stateStart == null || !stateKind) return;
    const x0 = xs[stateStart];
    const x1 = xs[end];
    if (!Number.isFinite(x0) || !Number.isFinite(x1)) return;
    const color = stateKind > 0 ? bullishColor : bearishColor;
    states += `<rect x="${Math.min(x0, x1).toFixed(1)}" y="${plotTop}" width="${Math.max(1, Math.abs(x1 - x0)).toFixed(1)}" height="${plotHeight}" fill="${color}" opacity="0.045"/>`;
  };
  if (config.showRsi !== false) {
    const lower = config.rsiLower ?? 20;
    const upper = config.rsiUpper ?? 80;
    for (let index = renderFrom; index < values.length; index++) {
      const rsiValue = study.rsi[index];
      const kind = !Number.isFinite(rsiValue) ? 0 : rsiValue < lower ? 1 : rsiValue > upper ? -1 : 0;
      if (kind !== stateKind) {
        flushState(index - 1);
        stateStart = kind ? index : null;
        stateKind = kind;
      }
    }
    flushState(values.length - 1);
    for (let index = Math.max(renderFrom, 1); index < values.length; index++) {
      const previous = study.rsi[index - 1];
      const current = study.rsi[index];
      if (!Number.isFinite(previous) || !Number.isFinite(current) || !Number.isFinite(xs[index])) continue;
      const bullishSignal = previous <= lower && current > lower;
      const bearishSignal = previous >= upper && current < upper;
      if (!bullishSignal && !bearishSignal) continue;
      const priorX = Number.isFinite(xs[index - 1]) ? xs[index - 1] : xs[index];
      const width = Math.max(2, Math.abs(xs[index] - priorX));
      const color = bullishSignal ? bullishColor : bearishColor;
      signals += `<rect x="${(xs[index] - width / 2).toFixed(1)}" y="${plotTop}" width="${width.toFixed(1)}" height="${plotHeight}" fill="${color}" opacity="0.13"/>`;
    }
  }

  if (config.showSessions !== false && intervalMs <= 3_600_000) {
    // Same monochrome treatment as the sidebar allocation donut: every
    // session tick is white, and *brightness* ranks them by typical trading
    // activity instead of hue — America is the busiest overlap session,
    // then London, then Asian hours, then the quiet Sydney-only stretch.
    // (mergedUtcSession's own .color is left alone — the separate "color
    // candles by session" feature below still uses it as a real hue.)
    const SESSION_BRIGHTNESS = { 'new-york': 0.85, london: 0.62, tokyo: 0.42, sydney: 0.24 };
    let start = renderFrom;
    while (start < times.length) {
      const session = mergedUtcSession(times[start]);
      let end = start;
      while (end + 1 < times.length && mergedUtcSession(times[end + 1]).key === session.key) end++;
      const x0 = xs[start];
      const x1 = xs[end];
      if (Number.isFinite(x0) && Number.isFinite(x1)) {
        const opacity = SESSION_BRIGHTNESS[session.key] ?? 0.46;
        sessions += `<rect x="${Math.min(x0, x1).toFixed(1)}" y="${(plotTop + plotHeight - 3).toFixed(1)}" width="${Math.max(1, Math.abs(x1 - x0)).toFixed(1)}" height="3" rx="1" fill="rgb(var(--ink-rgb))" opacity="${opacity.toFixed(2)}"/>`;
      }
      start = end + 1;
    }
  }

  return `<defs><clipPath id="${clipId}"><rect x="-100000" y="${plotTop}" width="200000" height="${plotHeight}"/></clipPath></defs><g class="atmos-chart-indicator-overlay tc-samsara-overlay" clip-path="url(#${clipId})">${states}${signals}${fills}${lines}${sessions}</g>`;
}

/** Raster equivalent of the SVG overlay. The caller owns bitmap sizing/clearing. */
function renderSamsaraOverlayCanvas(ctx, {
  values, times, xs, renderFrom = 0, yOf, plotTop, plotHeight,
  bullishColor, bearishColor, config = SAMSARA_DEFAULTS,
  study: precomputedStudy, intervalMs = 0, inkColor = '#ffffff',
}) {
  if (values.length < 2) return;
  const study = precomputedStudy || buildSamsaraStudy(values, config);
  const round = value => Number(value.toFixed(1));
  const rect = (x, width, color, opacity) => {
    ctx.fillStyle = color; ctx.globalAlpha = opacity;
    ctx.fillRect(round(x), plotTop, round(width), plotHeight);
  };
  ctx.save();
  ctx.beginPath(); ctx.rect(-100000, plotTop, 200000, plotHeight); ctx.clip();
  if (config.showRsi !== false) {
    const lower = config.rsiLower ?? 20, upper = config.rsiUpper ?? 80;
    let start = null, kind = 0;
    const flush = end => {
      if (start == null || !kind || !Number.isFinite(xs[start]) || !Number.isFinite(xs[end])) return;
      rect(Math.min(xs[start], xs[end]), Math.max(1, Math.abs(xs[end] - xs[start])), kind > 0 ? bullishColor : bearishColor, .045);
    };
    for (let i = renderFrom; i < values.length; i++) {
      const rsi = study.rsi[i], next = !Number.isFinite(rsi) ? 0 : rsi < lower ? 1 : rsi > upper ? -1 : 0;
      if (next !== kind) { flush(i - 1); start = next ? i : null; kind = next; }
    }
    flush(values.length - 1);
    for (let i = Math.max(renderFrom, 1); i < values.length; i++) {
      const previous = study.rsi[i - 1], current = study.rsi[i];
      if (!Number.isFinite(previous) || !Number.isFinite(current) || !Number.isFinite(xs[i])) continue;
      const up = previous <= lower && current > lower, down = previous >= upper && current < upper;
      if (!up && !down) continue;
      const prior = Number.isFinite(xs[i - 1]) ? xs[i - 1] : xs[i];
      const width = Math.max(2, Math.abs(xs[i] - prior));
      rect(xs[i] - width / 2, width, up ? bullishColor : bearishColor, .13);
    }
  }
  if (config.showMovingAverages !== false) {
    const opacity = Math.max(0, Math.min(1, Number(config.movingAverageOpacity ?? SAMSARA_DEFAULTS.movingAverageOpacity)));
    const segments = study.movingAverages.flatMap(average => contiguousSegments(values, average.values, xs, renderFrom)).filter(segment => segment.points.length >= 2);
    // All fills precede all strokes, matching the SVG compositing order.
    for (const segment of segments) {
      ctx.fillStyle = segment.bullish ? bullishColor : bearishColor;
      ctx.globalAlpha = Number((opacity * .1).toFixed(3)); ctx.beginPath();
      segment.points.forEach((point, i) => ctx[i ? 'lineTo' : 'moveTo'](round(point.x), round(yOf(point.price))));
      for (let i = segment.points.length - 1; i >= 0; i--) { const point = segment.points[i]; ctx.lineTo(round(point.x), round(yOf(point.average))); }
      ctx.closePath(); ctx.fill();
    }
    ctx.lineWidth = .85; ctx.globalAlpha = Number(opacity.toFixed(3));
    for (const segment of segments) {
      ctx.strokeStyle = segment.bullish ? bullishColor : bearishColor; ctx.beginPath();
      segment.points.forEach((point, i) => ctx[i ? 'lineTo' : 'moveTo'](round(point.x), round(yOf(point.average))));
      ctx.stroke();
    }
  }
  if (config.showSessions !== false && intervalMs <= 3600000) {
    const brightness = { 'new-york': .85, london: .62, tokyo: .42, sydney: .24 };
    for (let start = renderFrom; start < times.length;) {
      const session = mergedUtcSession(times[start]); let end = start;
      while (end + 1 < times.length && mergedUtcSession(times[end + 1]).key === session.key) end++;
      if (Number.isFinite(xs[start]) && Number.isFinite(xs[end])) {
        ctx.fillStyle = inkColor; ctx.globalAlpha = brightness[session.key] ?? .46;
        ctx.beginPath(); ctx.roundRect(round(Math.min(xs[start], xs[end])), round(plotTop + plotHeight - 3), round(Math.max(1, Math.abs(xs[end] - xs[start]))), 3, 1); ctx.fill();
      }
      start = end + 1;
    }
  }
  ctx.restore();
}

const W=1100,H=460, dpr=devicePixelRatio;
const svg=document.querySelector('#svg'),canvas=document.querySelector('#canvas'),cross=document.querySelector('#cross'),status=document.querySelector('#status');
canvas.width=W*dpr;canvas.height=H*dpr;const ctx=canvas.getContext('2d');ctx.scale(dpr,dpr);
const next=()=>new Promise(requestAnimationFrame);
const stat=a=>{const b=[...a].sort((x,y)=>x-y);return {median:b[Math.floor(b.length*.5)],p95:b[Math.min(b.length-1,Math.floor(b.length*.95))],mean:b.reduce((x,y)=>x+y,0)/b.length,max:b.at(-1)}};
const samples=[];let hidden=false;document.addEventListener('visibilitychange',()=>{if(document.hidden)hidden=true});
function data(n){return Array.from({length:n},(_,i)=>{const o=100+15*Math.sin(i*.071),c=o+3*Math.sin(i*.43);return {t0:i*60000,t1:(i+1)*60000,o,c,h:Math.max(o,c)+2,l:Math.min(o,c)-2}})}
let cachedCandles,study,values,times;
function draw(mode,candles,shift){if(cachedCandles!==candles){cachedCandles=candles;values=candles.map(c=>c.c);times=candles.map(c=>c.t0);study=buildSamsaraStudy(values)}const args={values,times,study,xs:candles.map((_,i)=>4+(i+.5)*1040/candles.length+shift),yOf:p=>436-(p-75)/50*428,plotTop:8,plotHeight:428,bullishColor:'#39d98a',bearishColor:'#ff647c'};if(mode==='svg')svg.innerHTML=renderSamsaraOverlaySVG(args);else{ctx.clearRect(0,0,W,H);renderSamsaraOverlayCanvas(ctx,args)}}
async function runCase(mode,n,scenario,repeat){
 status.textContent=mode.toUpperCase()+' · '+n+' candles · '+scenario+' · run '+(repeat+1);
 svg.style.display=mode==='svg'?'':'none';canvas.style.display=mode==='canvas'?'':'none';svg.innerHTML='';ctx.clearRect(0,0,W,H);cross.setAttribute('d','');
 const candles=data(n);draw(mode,candles,0);for(let i=0;i<12;i++)await next();
 const cpu=[],frames=[];let prior=await next();
 for(let i=0;i<60;i++){
  const t=performance.now();
  if(scenario==='redraw')draw(mode,candles,Math.sin(i*.14)*12);
  if(scenario==='hover'){const x=50+i*16,y=100+(i*7)%250;cross.setAttribute('d','M 4 '+y+' H 1044 M '+x+' 8 V 436')}
  cpu.push(performance.now()-t);const now=await next();frames.push(now-prior);prior=now;
 }
 samples.push({mode,n,scenario,repeat,cpu:stat(cpu),frame:stat(frames),cpuSamples:cpu,frameSamples:frames,svgNodes:mode==='svg'?svg.childElementCount:0});
}
document.querySelector('#run').onclick=async()=>{
 document.querySelector('#run').disabled=true;hidden=false;samples.length=0;
 try{
  for(let repeat=0;repeat<3;repeat++)for(const n of [250,1000,5000])for(const scenario of ['redraw','hover'])for(const mode of (repeat%2?['canvas','svg']:['svg','canvas']))await runCase(mode,n,scenario,repeat);
  const summary=[];for(const n of [250,1000,5000])for(const scenario of ['redraw','hover'])for(const mode of ['svg','canvas']){const cases=samples.filter(x=>x.n===n&&x.scenario===scenario&&x.mode===mode);summary.push({mode,n,scenario,cpu:stat(cases.flatMap(x=>x.cpuSamples)),frame:stat(cases.flatMap(x=>x.frameSamples))})}
  const gl=document.createElement('canvas').getContext('webgl');const ext=gl?.getExtension('WEBGL_debug_renderer_info');
  const result={date:new Date().toISOString(),userAgent:navigator.userAgent,dpr,width:W,height:H,hiddenDuringRun:hidden,gpu:ext?gl.getParameter(ext.UNMASKED_RENDERER_WEBGL):'unavailable',summary,samples};
  document.querySelector('#result').textContent=summary.map(x=>x.n+' '+x.mode+' '+x.scenario+' | drawing median '+x.cpu.median.toFixed(2)+' ms / p95 '+x.cpu.p95.toFixed(2)+' ms | frame median '+x.frame.median.toFixed(2)+' ms / p95 '+x.frame.p95.toFixed(2)+' ms').join('\n');
  await fetch('/results',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(result)});
  status.textContent='Complete. Results saved.'+(hidden?' WARNING: tab was hidden during this run.':'');
 }catch(error){status.textContent='Failed: '+error.message}finally{document.querySelector('#run').disabled=false}
};
</script>
